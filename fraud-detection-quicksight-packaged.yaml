  # ===========================================================================
  # DETECTION LAMBDA FUNCTIONS (unchanged from original)
  # ===========================================================================

  CoordTradingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-detect-coordinated-trading'
      RetentionInDays: 7

  CoordTradingDetector:
    Type: AWS::Lambda::Function
    DependsOn: CoordTradingLogGroup
    Properties:
      FunctionName: !Sub '${EnvironmentName}-detect-coordinated-trading'
      Runtime: python3.11
      Role: !GetAtt DetectorLambdaRole.Arn
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_STREAM: !Ref AlertsStream
          VELOCITY_TABLE: !Ref VelocityTable
          ENV_NAME: !Ref EnvironmentName
      Code:
        ZipFile: |
          import base64, boto3, json, os, time, uuid

          kinesis = boto3.client("kinesis")
          dynamo  = boto3.resource("dynamodb")
          vel_tbl = dynamo.Table(os.environ["VELOCITY_TABLE"])
          ALERTS     = os.environ["ALERTS_STREAM"]
          VEL_THRESH = 5
          VEL_WIN    = 60

          def _alert(account_id, typology, severity, signal, method, score, extra=None):
              a = {
                  "alert_id": str(uuid.uuid4()),
                  "entity_id": account_id,
                  "entity_type": "ACCOUNT",
                  "typology": typology,
                  "severity": severity,
                  "risk_score": round(score, 4),
                  "signals": [signal],
                  "detection_method": method,
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "created_at": int(time.time() * 1000),
              }
              if extra:
                  a.update(extra)
              kinesis.put_record(
                  StreamName=ALERTS,
                  Data=json.dumps(a),
                  PartitionKey=account_id or "default",
              )

          def _check_velocity(account_id, instrument, direction):
              now = int(time.time())
              key = account_id + ":" + instrument + ":" + direction
              win = now - VEL_WIN
              try:
                  r = vel_tbl.query(
                      KeyConditionExpression="counter_key = :k AND window_start > :w",
                      ExpressionAttributeValues={":k": key, ":w": win},
                  )
                  count = r["Count"] + 1
                  vel_tbl.put_item(Item={"counter_key": key, "window_start": now, "ttl": now + 3600})
                  return count
              except Exception as e:
                  print("velocity error: " + str(e))
                  return 1

          def _heuristic_score(data, vel_count):
              score = 0.0
              cluster_id = data.get("cluster_id")
              if cluster_id:
                  score += 0.35
              if vel_count >= VEL_THRESH:
                  score += 0.40
              lots = float(data.get("lots", 0))
              if lots > 50:
                  score += 0.15
              pnl = float(data.get("pnl", 0))
              if pnl > 10000:
                  score += 0.10
              return min(score, 0.99)

          def handler(event, context):
              for record in event.get("Records", []):
                  try:
                      data       = json.loads(base64.b64decode(record["kinesis"]["data"]))
                      account_id = data.get("account_id", "")
                      instrument = data.get("instrument", "")
                      direction  = data.get("direction", "")
                      cluster_id = data.get("cluster_id")

                      vel_count = _check_velocity(account_id, instrument, direction)

                      if vel_count >= VEL_THRESH:
                          _alert(account_id, "COORDINATED_TRADING", "HIGH",
                                 "VELOCITY_SAME_INSTRUMENT_DIRECTION", "RULE", 0.82,
                                 {"cluster_id": cluster_id, "instrument": instrument,
                                  "velocity_count": vel_count})

                      if cluster_id:
                          score = _heuristic_score(data, vel_count)
                          if score >= 0.6:
                              _alert(account_id, "COORDINATED_TRADING", "HIGH",
                                     "CLUSTER_HEURISTIC_SCORE", "HEURISTIC", score,
                                     {"cluster_id": cluster_id, "instrument": instrument})
                  except Exception as e:
                      print("Record error: " + str(e))
      Tags: [{Key: Project, Value: FraudDetectionDemo}]

  CoordTradingTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt TradesStream.Arn
      FunctionName: !GetAtt CoordTradingDetector.Arn
      StartingPosition: LATEST
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 5
      BisectBatchOnFunctionError: true

  ATOLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-detect-account-takeover'
      RetentionInDays: 7

  ATODetector:
    Type: AWS::Lambda::Function
    DependsOn: ATOLogGroup
    Properties:
      FunctionName: !Sub '${EnvironmentName}-detect-account-takeover'
      Runtime: python3.11
      Role: !GetAtt DetectorLambdaRole.Arn
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_STREAM: !Ref AlertsStream
          ENTITY_TABLE: !Ref EntityStateTable
          ENV_NAME: !Ref EnvironmentName
      Code:
        ZipFile: |
          import base64, boto3, json, math, os, time, uuid
          from decimal import Decimal
          kinesis = boto3.client("kinesis")
          dynamo  = boto3.resource("dynamodb")
          ent_tbl = dynamo.Table(os.environ["ENTITY_TABLE"])
          ALERTS       = os.environ["ALERTS_STREAM"]
          GEO_KPH      = 900.0
          CRED_THRESH  = 10

          def _haversine(lat1, lon1, lat2, lon2):
              R  = 6371.0
              p1 = math.radians(lat1)
              p2 = math.radians(lat2)
              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)
              a  = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2
              return R * 2 * math.atan2(math.sqrt(a), math.sqrt(1 - a))

          def _alert(account_id, typology, severity, signal, method, score, extra=None):
              a = {
                  "alert_id": str(uuid.uuid4()),
                  "entity_id": account_id,
                  "entity_type": "ACCOUNT",
                  "typology": typology,
                  "severity": severity,
                  "risk_score": round(score, 4),
                  "signals": [signal],
                  "detection_method": method,
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "created_at": int(time.time() * 1000),
              }
              if extra:
                  a.update(extra)
              kinesis.put_record(
                  StreamName=ALERTS,
                  Data=json.dumps(a),
                  PartitionKey=account_id or "default",
              )

          def _get_state(account_id):
              try:
                  r = ent_tbl.get_item(Key={"entity_id": account_id, "entity_type": "ACCOUNT"})
                  return r.get("Item", {})
              except Exception:
                  return {}

          def _update_state(account_id, updates):
              try:
                  safe   = {k: Decimal(str(v)) if isinstance(v, float) else v
                            for k, v in updates.items()}
                  names  = {"#" + k: k for k in safe}
                  values = {":" + k: v for k, v in safe.items()}
                  expr   = "SET " + ", ".join("#" + k + " = :" + k for k in safe)
                  ent_tbl.update_item(
                      Key={"entity_id": account_id, "entity_type": "ACCOUNT"},
                      UpdateExpression=expr,
                      ExpressionAttributeNames=names,
                      ExpressionAttributeValues=values,
                  )
              except Exception as e:
                  print("state update error: " + str(e))

          def _ato_heuristic(is_new_device, is_new_country, geo_vel, recent_fails,
                             has_pending_withdrawal, pw_reset):
              score = 0.0
              if geo_vel > GEO_KPH:
                  score += 0.50
              elif geo_vel > 500:
                  score += 0.25
              if is_new_device and is_new_country:
                  score += 0.30
              elif is_new_device or is_new_country:
                  score += 0.15
              if recent_fails >= CRED_THRESH:
                  score += 0.20
              elif recent_fails >= 5:
                  score += 0.10
              if has_pending_withdrawal:
                  score += 0.10
              if pw_reset:
                  score += 0.10
              return min(score, 0.99)

          def handler(event, context):
              for record in event.get("Records", []):
                  try:
                      data       = json.loads(base64.b64decode(record["kinesis"]["data"]))
                      account_id = data.get("account_id", "")
                      subtype    = data.get("event_subtype", "")
                      lat        = float(data.get("lat", 0))
                      lon        = float(data.get("lon", 0))
                      epoch_ms   = float(data.get("epoch_ms", time.time() * 1000))
                      device_id  = data.get("device_id", "")
                      state      = _get_state(account_id)

                      if subtype in ("LOGIN", "LOGIN_FAILED"):
                          last_lat = float(state.get("last_lat", lat))
                          last_lon = float(state.get("last_lon", lon))
                          last_ms  = float(state.get("last_login_ms", epoch_ms))
                          delta_h  = abs(epoch_ms - last_ms) / 3_600_000
                          geo_vel = 0.0
                          if delta_h > 0.001:
                              dist    = _haversine(last_lat, last_lon, lat, lon)
                              geo_vel = dist / delta_h
                          if geo_vel > GEO_KPH:
                              _alert(account_id, "ACCOUNT_TAKEOVER", "CRITICAL",
                                     "GEO_VELOCITY_IMPOSSIBLE", "RULE", 0.92,
                                     {"velocity_kph": round(geo_vel, 1),
                                      "country_code": data.get("country_code")})
                          if subtype == "LOGIN_FAILED":
                              fails = int(state.get("recent_fails", 0)) + 1
                              _update_state(account_id, {
                                  "recent_fails": fails,
                                  "fail_window_start": epoch_ms,
                                  "ttl": int(time.time()) + 86400,
                              })
                              if fails >= CRED_THRESH:
                                  _alert(account_id, "ACCOUNT_TAKEOVER", "HIGH",
                                         "CREDENTIAL_STUFFING", "RULE", 0.85,
                                         {"failed_count": fails})
                          else:
                              known_devices   = state.get("known_devices", [])
                              known_countries = state.get("known_countries", [])
                              is_new_device   = device_id not in known_devices
                              is_new_country  = data.get("country_code") not in known_countries
                              recent_fails    = int(state.get("recent_fails", 0))
                              hw              = int(state.get("has_pending_withdrawal", 0))
                              pw_reset        = int(state.get("recent_pw_reset", 0))
                              score = _ato_heuristic(
                                  is_new_device, is_new_country, geo_vel,
                                  recent_fails, hw, pw_reset,
                              )
                              if score >= 0.6:
                                  _alert(account_id, "ACCOUNT_TAKEOVER", "HIGH",
                                         "ML_HIGH_LOGIN_RISK", "HEURISTIC", score,
                                         {"is_new_device": is_new_device,
                                          "is_new_country": is_new_country,
                                          "geo_velocity_kph": round(geo_vel, 1)})
                              new_devices   = list(set(known_devices + [device_id]))[-20:]
                              new_countries = list(set(known_countries + [data.get("country_code", "")]))[-20:]
                              _update_state(account_id, {
                                  "last_lat": lat, "last_lon": lon,
                                  "last_login_ms": epoch_ms,
                                  "known_devices": new_devices,
                                  "known_countries": new_countries,
                                  "recent_fails": 0,
                                  "ttl": int(time.time()) + 86400 * 30,
                              })
                      elif subtype == "WITHDRAWAL_REQUEST":
                          _update_state(account_id, {
                              "has_pending_withdrawal": 1,
                              "ttl": int(time.time()) + 86400,
                          })
                  except Exception as e:
                      print("Record error: " + str(e))
      Tags: [{Key: Project, Value: FraudDetectionDemo}]

