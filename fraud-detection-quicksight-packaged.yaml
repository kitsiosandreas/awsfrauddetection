  # ===========================================================================
  # ALERT PROCESSOR — reads alerts stream, writes to DynamoDB + SNS
  # OpenSearch has been removed; S3 landing via Firehose handles analytics
  # ===========================================================================

  AlertProcessorLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-alert-processor'
      RetentionInDays: 7

  AlertProcessorLambda:
    Type: AWS::Lambda::Function
    DependsOn: AlertProcessorLogGroup
    Properties:
      FunctionName: !Sub '${EnvironmentName}-alert-processor'
      Runtime: python3.11
      Role: !GetAtt AlertProcessorRole.Arn
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ALERTS_TABLE:      !Ref AlertsTable
          CRITICAL_TOPIC_ARN: !Ref CriticalAlertsTopic
          STANDARD_TOPIC_ARN: !Ref StandardAlertsTopic
      Code:
        ZipFile: |
          """
          Alert Processor — writes alerts to DynamoDB for Step Functions triage
          and publishes high-severity alerts to SNS for email notification.

          Analytics ingestion (S3/Athena/QuickSight) is handled automatically
          by the Kinesis Data Firehose delivery stream — no code required here.
          """
          import base64, boto3, json, os, time, uuid
          from decimal import Decimal

          dynamo   = boto3.resource("dynamodb")
          sns      = boto3.client("sns")
          table    = dynamo.Table(os.environ["ALERTS_TABLE"])
          CRIT_ARN = os.environ["CRITICAL_TOPIC_ARN"]
          STD_ARN  = os.environ["STANDARD_TOPIC_ARN"]

          def _to_decimal(obj):
              """DynamoDB requires Decimal for all float/number values."""
              if isinstance(obj, float):  return Decimal(str(obj))
              if isinstance(obj, dict):   return {k: _to_decimal(v) for k, v in obj.items()}
              if isinstance(obj, list):   return [_to_decimal(i) for i in obj]
              return obj

          def handler(event, context):
              for record in event.get("Records", []):
                  try:
                      alert = json.loads(base64.b64decode(record["kinesis"]["data"]))
                      alert.setdefault("alert_id", str(uuid.uuid4()))
                      alert["ttl"]    = int(time.time()) + 30 * 86400
                      alert["status"] = "NEW"

                      # Persist to DynamoDB (feeds Step Functions triage)
                      table.put_item(Item=_to_decimal(alert))

                      # SNS notifications for actionable severities
                      sev = alert.get("severity", "LOW")
                      if sev in ("CRITICAL", "HIGH"):
                          topic = CRIT_ARN if sev == "CRITICAL" else STD_ARN
                          sns.publish(
                              TopicArn=topic,
                              Subject=(
                                  "[" + sev + "] Fraud Alert: "
                                  + alert.get("typology", "")
                                  + " — "
                                  + alert.get("entity_id", "")
                              ),
                              Message=json.dumps(alert, indent=2, default=str),
                          )
                  except Exception as e:
                      print("Alert error: " + str(e))
      Tags: [{Key: Project, Value: FraudDetectionDemo}]

  AlertProcessorTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AlertsStream.Arn
      FunctionName: !GetAtt AlertProcessorLambda.Arn
      StartingPosition: LATEST
      BatchSize: 50
      MaximumBatchingWindowInSeconds: 5

  # ===========================================================================
  # ALERTING (SNS + Step Functions)
  # ===========================================================================

  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvironmentName}-critical-alerts'
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  StandardAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${EnvironmentName}-standard-alerts'

  InvestigationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/aws/states/${EnvironmentName}-investigation'
      RetentionInDays: 7

  InvestigationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${EnvironmentName}-investigation'
      RoleArn: !GetAtt StepFunctionsRole.Arn
      Definition:
        Comment: Fraud alert triage — auto-block CRITICAL, review HIGH, monitor MEDIUM/LOW
        StartAt: SeverityGate
        TimeoutSeconds: 300
        States:
          SeverityGate:
            Type: Choice
            Choices:
              - Variable: $.severity
                StringEquals: CRITICAL
                Next: AutoBlock
              - Variable: $.severity
                StringEquals: HIGH
                Next: FlagForReview
            Default: MonitorWatchlist
          AutoBlock:
            Type: Task
            Resource: !Sub 'arn:${AWS::Partition}:states:::dynamodb:putItem'
            Parameters:
              TableName: !Ref AlertsTable
              Item:
                alert_id:  {S.$: $.alert_id}
                created_at: {N: '0'}
                decision:  {S: AUTO_BLOCK}
                status:    {S: BLOCKED}
            End: true
          FlagForReview:
            Type: Task
            Resource: !Sub 'arn:${AWS::Partition}:states:::dynamodb:putItem'
            Parameters:
              TableName: !Ref AlertsTable
              Item:
                alert_id:  {S.$: $.alert_id}
                created_at: {N: '0'}
                decision:  {S: FLAG_FOR_REVIEW}
                status:    {S: REVIEWING}
            End: true
          MonitorWatchlist:
            Type: Task
            Resource: !Sub 'arn:${AWS::Partition}:states:::dynamodb:putItem'
            Parameters:
              TableName: !Ref AlertsTable
              Item:
                alert_id:  {S.$: $.alert_id}
                created_at: {N: '0'}
                decision:  {S: MONITOR}
                status:    {S: WATCHLIST}
            End: true


