  SysAbuseLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-detect-system-abuse'
      RetentionInDays: 7

  SysAbuseDetector:
    Type: AWS::Lambda::Function
    DependsOn: SysAbuseLogGroup
    Properties:
      FunctionName: !Sub '${EnvironmentName}-detect-system-abuse'
      Runtime: python3.11
      Role: !GetAtt DetectorLambdaRole.Arn
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          ALERTS_STREAM: !Ref AlertsStream
          VELOCITY_TABLE: !Ref VelocityTable
          ENV_NAME: !Ref EnvironmentName
      Code:
        ZipFile: |
          import base64, boto3, json, os, time, uuid

          kinesis = boto3.client("kinesis")
          dynamo  = boto3.resource("dynamodb")
          vel_tbl = dynamo.Table(os.environ["VELOCITY_TABLE"])
          ALERTS     = os.environ["ALERTS_STREAM"]
          API_THRESH = 200
          API_WIN    = 60
          REG_THRESH = 5

          def _alert(account_id, typology, severity, signal, method, score, extra=None):
              a = {
                  "alert_id": str(uuid.uuid4()),
                  "entity_id": account_id,
                  "entity_type": "ACCOUNT",
                  "typology": typology,
                  "severity": severity,
                  "risk_score": round(score, 4),
                  "signals": [signal],
                  "detection_method": method,
                  "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "created_at": int(time.time() * 1000),
              }
              if extra:
                  a.update(extra)
              kinesis.put_record(
                  StreamName=ALERTS,
                  Data=json.dumps(a),
                  PartitionKey=account_id or "default",
              )

          def _count_window(key, window_s, ttl_s=3600):
              now = int(time.time())
              win = now - window_s
              try:
                  r     = vel_tbl.query(
                      KeyConditionExpression="counter_key = :k AND window_start > :w",
                      ExpressionAttributeValues={":k": key, ":w": win},
                  )
                  count = r["Count"] + 1
                  vel_tbl.put_item(Item={"counter_key": key, "window_start": now, "ttl": now + ttl_s})
                  return count
              except Exception:
                  return 1

          def _bot_heuristic(reg_count, form_fill_sec, hour):
              score = 0.0
              if reg_count >= REG_THRESH:
                  score += 0.40
              elif reg_count >= 3:
                  score += 0.20
              if form_fill_sec < 5:
                  score += 0.35
              elif form_fill_sec < 15:
                  score += 0.15
              if hour in (2, 3, 4):
                  score += 0.10
              return min(score, 0.99)

          def handler(event, context):
              for record in event.get("Records", []):
                  try:
                      data       = json.loads(base64.b64decode(record["kinesis"]["data"]))
                      account_id = data.get("account_id", "")
                      etype      = data.get("event_type", "")
                      if etype == "API_CALL":
                          count = _count_window("api:" + account_id, API_WIN)
                          rate  = count * (60 / API_WIN)
                          if rate > API_THRESH:
                              _alert(account_id, "SYSTEM_ABUSE", "MEDIUM",
                                     "API_RATE_EXCEEDED", "RULE",
                                     min(0.99, rate / (API_THRESH * 2)),
                                     {"rate_per_min": round(rate, 1)})
                      elif etype == "REGISTRATION":
                          ip_prefix = ".".join(data.get("ip_address", "0.0.0.0").split(".")[:3])
                          reg_count = _count_window("reg_ip:" + ip_prefix, 86400, 86400 * 2)
                          if reg_count >= REG_THRESH:
                              _alert(account_id, "SYSTEM_ABUSE", "HIGH",
                                     "REGISTRATION_BURST_FROM_IP", "RULE", 0.85,
                                     {"ip_prefix": ip_prefix, "count": reg_count})
                          form_fill = float(data.get("form_fill_time_sec", 60))
                          hour      = time.gmtime().tm_hour
                          score     = _bot_heuristic(reg_count, form_fill, hour)
                          if score >= 0.6:
                              _alert(account_id, "SYSTEM_ABUSE", "HIGH",
                                     "ML_BOT_DETECTED", "HEURISTIC", score,
                                     {"reg_count": reg_count,
                                      "form_fill_sec": form_fill})
                  except Exception as e:
                      print("Record error: " + str(e))
      Tags: [{Key: Project, Value: FraudDetectionDemo}]

