            - {Name: STREAM_SESSIONS,      Value: !Ref SessionsStream}
            - {Name: STREAM_REGISTRATIONS, Value: !Ref RegistrationsStream}
            - {Name: STREAM_API_CALLS,     Value: !Ref ApiCallsStream}
            - {Name: RDS_ENDPOINT,         Value: !GetAtt RdsInstance.Endpoint.Address}
            - {Name: RDS_SECRET_ARN,       Value: !Ref RdsSecret}
            - {Name: RAW_DATA_BUCKET,      Value: !Ref RawDataBucket}
            - {Name: ENRICHMENT_BUCKET,    Value: !Ref EnrichmentBucket}
            - {Name: AWS_DEFAULT_REGION,   Value: !Ref 'AWS::Region'}
            - {Name: SCENARIO,             Value: !Ref GeneratorScenario}
            - {Name: TPS,                  Value: !Sub '${GeneratorTps}'}
            - {Name: TOTAL_ACCOUNTS,       Value: !Sub '${GeneratorAccounts}'}
            - {Name: FRAUD_RATE,           Value: '0.15'}
            - {Name: USE_KINESIS,          Value: 'true'}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DatagenLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: datagen

  # ===========================================================================
  # CODEBUILD BOOTSTRAP
  # Builds Docker image, pushes to ECR, launches ECS Fargate task.
  # Run ONCE after CREATE_COMPLETE:
  #   aws codebuild start-build --project-name <BootstrapProjectName>
  # The buildspec and data_generator source are embedded in the bootstrap
  # bucket by the packager (package.py) before deployment.
  # ===========================================================================

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${EnvironmentName}-bootstrap'
      RetentionInDays: 7

  BootstrapProject:
    Type: AWS::CodeBuild::Project
    DependsOn: SourceUploader
    Properties:
      Name: !Sub '${EnvironmentName}-bootstrap'
      Description: >
        Builds the data-generator Docker image, pushes it to ECR,
        and starts the ECS Fargate task. Run once after CREATE_COMPLETE.
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts: {Type: NO_ARTIFACTS}
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:7.0
        ComputeType: BUILD_GENERAL1_MEDIUM
        PrivilegedMode: true
        EnvironmentVariables:
          - {Name: AWS_ACCOUNT_ID,     Value: !Ref 'AWS::AccountId'}
          - {Name: AWS_DEFAULT_REGION, Value: !Ref 'AWS::Region'}
          - {Name: ECR_REPO_URI,       Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${DatagenEcrRepo}'}
          - {Name: ENV_NAME,           Value: !Ref EnvironmentName}
          - {Name: ECS_CLUSTER,        Value: !Sub '${EnvironmentName}-datagen'}
          - {Name: ECS_TASK_DEF,       Value: !Sub '${EnvironmentName}-datagen'}
          - {Name: ECS_SUBNET,         Value: !Ref PublicSubnet1}
          - {Name: ECS_SG,             Value: !Ref EcsSG}
      Source:
        Type: S3
        Location: !Sub '${BootstrapBucket}/buildspec/source.zip'
      VpcConfig:
        VpcId: !Ref VPC
        Subnets: [!Ref PrivateSubnet1]
        SecurityGroupIds: [!Ref CodeBuildSG]
      TimeoutInMinutes: 30
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
      Tags: [{Key: Project, Value: FraudDetectionDemo}]


  # =========================================================================
  # SOURCE UPLOADER (injected by package_quicksight.py)
  # Decodes the embedded data-generator zip and writes it to the
  # BootstrapBucket so CodeBuild can build the image. Makes the stack
  # fully self-contained — no manual S3 upload required.
  # =========================================================================
  SourceUploaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: UploadSourceZip
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub '${BootstrapBucket.Arn}/*'

  SourceUploaderFunc:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-source-uploader'
      Runtime: python3.11
      Role: !GetAtt SourceUploaderRole.Arn
      Handler: index.handler
      Timeout: 120
      MemorySize: 256
      Code:
        ZipFile: |
          import base64, boto3, cfnresponse
          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return
                  p = event['ResourceProperties']
                  boto3.client('s3').put_object(
                      Bucket=p['Bucket'], Key=p['Key'],
                      Body=base64.b64decode(p['ZipBase64']))
                  cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                   {'Bucket': p['Bucket'], 'Key': p['Key']})
              except Exception as exc:
                  print('SourceUploader error: ' + str(exc))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(exc)})

  SourceUploader:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: [BootstrapBucket, SourceUploaderFunc]
    Properties:
      ServiceToken: !GetAtt SourceUploaderFunc.Arn
      Bucket: !Ref BootstrapBucket
      Key: buildspec/source.zip
      ZipHash: 'UEsDBBQAAAAIAG5+'
      ZipBase64: ''


# =============================================================================
# OUTPUTS
# =============================================================================
Outputs:

  BootstrapBucketName:
    Value: !Ref BootstrapBucket
    Description: Upload source.zip here before running CodeBuild

  BootstrapProjectName:
    Value: !Ref BootstrapProject
    Description: Run after CREATE_COMPLETE to build Docker image and start ECS

  BootstrapCommand:
    Value: !Sub 'aws codebuild start-build --project-name ${BootstrapProject} --region ${AWS::Region}'
    Description: Exact command to trigger the bootstrap

  TradesStreamName:
    Value: !Ref TradesStream
    Description: Kinesis stream for trade events

  SessionsStreamName:
    Value: !Ref SessionsStream
    Description: Kinesis stream for session events

  AlertsStreamName:
    Value: !Ref AlertsStream
    Description: Kinesis stream for fraud alerts

  RdsEndpoint:
    Value: !GetAtt RdsInstance.Endpoint.Address
    Description: RDS PostgreSQL endpoint

  AnalyticsBucketName:
    Value: !Ref AnalyticsBucket
    Description: S3 bucket where Firehose lands Parquet files (alerts + trades)

  GlueDatabaseName:
    Value: !Ref GlueDatabase
    Description: Glue Data Catalog database name for Athena queries

  AthenaWorkgroupName:
    Value: !Ref AthenaWorkgroup
    Description: Athena workgroup — use this when running ad-hoc queries

  AthenaResultsLocation:
    Value: !Sub 's3://${AnalyticsBucket}/athena-results/'
    Description: S3 prefix for Athena query results

  AlertsFirehoseName:
    Value: !Ref AlertsFirehose
    Description: Kinesis Firehose delivery stream for alerts → S3 (Parquet)

  TradesFirehoseName:
    Value: !Ref TradesFirehose
    Description: Kinesis Firehose delivery stream for trades → S3 (Parquet)

  QuickSightDataSourceId:
    Value: !Sub '${EnvironmentName}-athena-source'
    Description: QuickSight data source ID — use to build additional analyses

  QuickSightDatasetsNote:
    Value: !Sub >
      Four datasets provisioned: ${EnvironmentName}-alerts-overview-ds,
      ${EnvironmentName}-entity-risk-ds, ${EnvironmentName}-alert-feed-ds,
      ${EnvironmentName}-trade-activity-ds.
      Open QuickSight → Datasets to create analyses and dashboards.
    Description: QuickSight datasets created by this stack

  AlertsTableName:
    Value: !Ref AlertsTable
    Description: DynamoDB alerts table (used by Step Functions triage)

  EcrRepositoryUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${DatagenEcrRepo}'
    Description: ECR URI for data generator image

  DeploymentSummary:
    Value: !Sub |
      Stack deployed. Next steps:
      1. Upload source.zip to S3, then run bootstrap CodeBuild project.
         Command: aws codebuild start-build --project-name ${BootstrapProject}
      2. Confirm the SNS subscription email in your inbox.
      3. Wait ~15 min for the first Glue crawler run to populate partitions.
      4. Open QuickSight → Datasets and trigger an initial SPICE refresh on
         the three SPICE datasets (alerts-overview, entity-risk, trade-activity).
      5. Create analyses from the datasets or use the pre-built named Athena
         queries in workgroup: ${AthenaWorkgroup}
      Analytics bucket: s3://${AnalyticsBucket}/
      Athena workgroup: ${AthenaWorkgroup}
      Glue database:    ${GlueDatabase}
    Description: Post-deployment checklist

